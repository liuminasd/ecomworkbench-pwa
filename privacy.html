  <h1>EcomWorkbench 隐私说明</h1>
  <p>本应用是纯本地运行的离线数据工具，所有数据仅保存在您设备的浏览器本地存储（IndexedDB）中，<strong>不上传到任何服务器</strong>。</p>

  <h2>数据存储</h2>
  <p>您的选品、日跟踪、回款、供应商、达人、定价、竞品等数据，全部存储在本机浏览器的 IndexedDB 中，清除浏览器数据或卸载应用会删除这些数据。</p>

  <h2>数据备份</h2>
  <p>您可在「更多」页导出 JSON 备份文件自行保管，或导入恢复。</p>

  <h2>权限</h2>
  <p>本应用不需要网络权限、位置权限、相机权限等任何敏感权限。Service Worker 仅用于缓存应用自身资源以实现离线使用。</p>

  <h2>联系方式</h2>
  <p>如有问题，请通过 GitHub 仓库联系开发者。</p>
